[project]
name = "sqlprofil"
version = "0.1.0"
description = "Datenqualitaet pro Tabelle: Profiling, Regeln, Fachwissen, Report und Chat. SQL Server, PostgreSQL und DuckDB, ADK + LiteLLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.0",
    "litellm>=1.60",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mssql = ["mssql-python>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
duckdb = ["duckdb>=1.0"]
all = ["mssql-python>=1.0", "psycopg[binary]>=3.1", "duckdb>=1.0"]
dev = ["pytest>=8", "duckdb>=1.0"]

[project.scripts]
sqlprofil = "sqlprofil.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sqlprofil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
